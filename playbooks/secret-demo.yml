---
- name: Demo secret handling
  hosts: workers
  gather_facts: false

  tasks:
    - name: Use secret without printing it
      ansible.builtin.copy:
        dest: /tmp/secret-demo.txt
        owner: ansible
        group: ansible
        mode: "0600"
        content: |
          secret_was_received=true
          secret_length={{ demo_secret | length }}
      no_log: true

    - name: Confirm secret file was created
      ansible.builtin.stat:
        path: /tmp/secret-demo.txt
      register: secret_file

    - name: Show safe result only
      ansible.builtin.debug:
        msg:
          - "Secret file exists: {{ secret_file.stat.exists }}"
          - "Secret file mode: {{ secret_file.stat.mode }}"
