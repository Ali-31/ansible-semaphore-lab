---
- name: Collect basic system information
  hosts: workers
  gather_facts: true

  tasks:
    - name: Show inventory hostname
      ansible.builtin.debug:
        msg: "Inventory hostname is {{ inventory_hostname }}"

    - name: Show real hostname
      ansible.builtin.debug:
        msg: "Real hostname is {{ ansible_hostname }}"

    - name: Show OS distribution
      ansible.builtin.debug:
        msg: "{{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Show default IPv4 address if available
      ansible.builtin.debug:
        msg: "Default IPv4 is {{ ansible_default_ipv4.address | default('not_available') }}"

    - name: Show architecture
      ansible.builtin.debug:
        msg: "Architecture is {{ ansible_architecture }}"
